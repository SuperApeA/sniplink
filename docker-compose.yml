name: sniplink
services:
  mysql:
    image: mysql:8.0
    container_name: sniplink-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root #mysql的密码
      MYSQL_DATABASE: sniplink
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sniplink
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sniplink-redis
    command: ["redis-server", "--appendonly", "yes", "--no-appendfsync-on-rewrite", "yes"] # 防止 AOF 后台重写时阻塞 Redis 主线程
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sniplink

volumes:
  mysql_data:
  redis_data:
networks:
  sniplink: