<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sniplink - 极简短链服务</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--primary); margin-bottom: 5px; }
        p.subtitle { color: #6B7280; margin-bottom: 30px; }
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: #ECFDF5;
            border: 1px solid #10B981;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
        .result.error { background: #FEF2F2; border-color: #EF4444; color: #B91C1C; }
        .result a { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 1.1rem;}
        .result a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>sniplink ✂️</h1>
    <p class="subtitle">极简、高效的短链生成与管理服务</p>

    <!-- 创建短链模块 -->
    <div class="card">
        <h2>🔗 生成短链</h2>
        <div class="form-group">
            <label>目标长链接 (URL)</label>
            <input type="text" id="longUrl" placeholder="https://golang.google.cn">
        </div>
        <div class="form-group">
            <label>自定义短码 (可选，不填则自动生成)</label>
            <input type="text" id="customCode" placeholder="如: golang，限1-16位字母数字">
        </div>
        <button onclick="createLink()">立即生成</button>

        <!-- 生成结果容器 -->
        <div id="createResult" class="result" style="display: none;"></div>
    </div>

    <!-- 查询详情模块 -->
    <div class="card">
        <h2>📊 查看统计</h2>
        <div class="form-group">
            <label>输入短码 (Code)</label>
            <input type="text" id="queryCode" placeholder="输入刚刚生成的短码">
        </div>
        <button onclick="queryLink()">查询详情</button>

        <!-- 查询结果容器 -->
        <div id="queryResult" class="result" style="display: none; background: #EFF6FF; border-color: #3B82F6; color: #1E3A8A;"></div>
    </div>

    <script>
        // 后端跑在 localhost:8080
        // 采用相对路径，效果是域名/api/v1
        const API_BASE = "/api/v1";

        // 错误码翻译字典
        function translateError(errMsg) {
            const dict = {
                "invalid url, must be http/https": "链接格式不正确，必须以 http 或 https 开头",
                "invalid custom_code, must match [0-9A-Za-z_-]{1,16}": "自定义短码格式错误，限 1-16 位字母、数字或下划线",
                "custom code already taken": "该自定义短码已被占用，请换一个吧",
                "link not found": "短链不存在或已过期",
                "internal error": "服务器开小差了，请稍后再试"
            };
            // 如果字典里有翻译，就返回中文；如果没有，就把原报错返回或显示未知错误
            return dict[errMsg] || errMsg || "未知错误";
        }

        // 创建短链
        async function createLink() {
            const url = document.getElementById('longUrl').value;
            const customCode = document.getElementById('customCode').value;
            const resultDiv = document.getElementById('createResult');

            if (!url) {
                alert("请输入长链接！");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        custom_code: customCode
                    })
                });

                const data = await response.json();

                resultDiv.style.display = 'block';
                if (response.ok) {
                    // 成功状态：绿色框，显示短链
                    resultDiv.className = 'result';
                    const shortUrl = data.short_url; // 直接使用后端返回的完整短链
                    resultDiv.innerHTML = `
                        <div style="margin-bottom: 8px;">🎉 生成成功！你的短链是：</div>
                        <!-- 链接独立一行，保证长链接自动折行不会挤压其他元素 -->
                        <div style="word-break: break-all; margin-bottom: 10px;">
                        <a href="${shortUrl}" target="_blank">${shortUrl}</a>
                        </div>
                        <!-- 底部按钮容器，justify-content: flex-end 强制按钮靠右 -->
                        <div style="display: flex; justify-content: flex-end; width: 100%;">
                            <button onclick="copyText('${shortUrl}', this)" style="width: auto; padding: 6px 16px; font-size: 0.9rem; background: #10B981; color: white; border: none; border-radius: 6px; cursor: pointer;">复制</button>
                        </div>
                    `;
                    // 自动填充查询框
                    document.getElementById('queryCode').value = data.code;
                } else {
                    // 失败状态：红色框，显示错误信息
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<div>❌ 生成失败：${translateError(data.error)}</div>`;
                }
            } catch (error) {
                console.error(error);
                alert("网络请求失败，请确保后端服务已启动！");
            }
        }

        // 查询统计
        async function queryLink() {
            const code = document.getElementById('queryCode').value;
            const resultDiv = document.getElementById('queryResult');

            if (!code) {
                alert("请输入短码！");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/links/${code}`);
                const data = await response.json();
                resultDiv.style.display = 'block';

                if (response.ok) {
                    // 成功：展示统计数据
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <p><b>短码:</b> ${data.code}</p>
                        <p><b>原始链接:</b> <a href="${data.url}" target="_blank" style="font-size: 1rem;">${data.url}</a></p>
                        <p><b>点击次数:</b> <span style="font-size:1.2rem; color:#E11D48; font-weight:bold;">${data.click_count}</span></p>
                        <p><b>创建时间:</b> ${new Date(data.created_at).toLocaleString()}</p>
                    `;
                } else {
                    // 失败：提示未找到
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<div>❌ 查询失败：${translateError(data.error)}</div>`;
                }
            } catch (error) {
                console.error(error);
                alert("网络请求失败！");
            }
        }

        // 复制到剪贴板功能
        async function copyText(text, btnElement) {
            try {
                // 现代浏览器 API (必须在 HTTPS 或 localhost 环境下)
                await navigator.clipboard.writeText(text);

                // 视觉反馈：改变按钮文字和颜色
                const originalText = btnElement.innerText;
                btnElement.innerText = "✅ 已复制";
                btnElement.style.background = "#059669"; // 深一点的绿色

                // 2秒后恢复原状
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "#10B981";
                }, 2000);

            } catch (err) {
                console.error('复制失败:', err);
                // 降级方案（针对极少数不支持 clipboard API 的老旧浏览器）
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                alert("已复制到剪贴板！");
            }
        }
    </script>
</body>
</html>
